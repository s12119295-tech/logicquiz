#title h1{margin:5vh 0 2px;text-shadow:0 2px 24px #000}#title .sub{text-shadow:0 2px 10px #000}
.row{display:flex;gap:8px;width:100%;max-width:340px}.row .btn{flex:1;padding:12px 4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:380px;overflow:auto;padding:4px}
.lv{aspect-ratio:1;border:0;border-radius:14px;background:#ffffff14;color:#fff;font:600 18px Alvand;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv .ss{display:flex;color:var(--g);height:10px}.lv.lk{opacity:.4}
.top{display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.ic{width:44px;height:44px;border-radius:14px;border:0;background:#ffffff18;color:#fff;display:flex;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-radius:14px;background:#ffffff18;color:#fff;font:600 16px Alvand}
.bar{height:6px;width:100%;background:#ffffff18;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));transition:width .4s}
.q{flex:1;display:flex;align-items:center;text-align:center;font:700 21px/1.9 Alvand;max-width:360px;overflow:auto}
.hint{min-height:24px;color:var(--g);font-size:14px;margin:2px 0;text-align:center}
.opts{width:100%;max-width:360px}
.o{width:100%;padding:13px;margin:6px 0;border:2px solid #ffffff22;border-radius:16px;background:#ffffff10;color:#fff;font:600 18px Alvand;transition:.2s}
.o:active{transform:scale(.96)}.o:disabled{color:#fff}.o.ok{background:#34d39944;border-color:var(--ok)}
.o.no{background:#fb718544;border-color:var(--no);animation:sh .4s}.o.x{opacity:.22;text-decoration:line-through;border-style:dashed}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.items{display:flex;gap:8px;width:100%;max-width:360px;margin:6px 0 10px}
.it{flex:1;position:relative;border:0;border-radius:14px;background:#ffffff14;color:#fff;padding:8px 2px;font:600 12px Alvand;display:flex;flex-direction:column;align-items:center;gap:3px}
.it:active{transform:scale(.94)}.it .pr{display:flex;align-items:center;gap:3px;color:var(--g);font-size:12px}
.it .nb{position:absolute;top:-7px;left:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--a);font-size:12px;display:flex;align-items:center;justify-content:center}
.shl{width:100%;max-width:380px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#ffffff14}
.card .ct{flex:1;display:flex;flex-direction:column}.card small{opacity:.7;font-size:13px}
.card .buy{width:auto;margin:0;padding:10px 14px;font-size:16px}
.ov{position:absolute;inset:0;background:#0b0820ee;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:9;text-align:center}.ov.on{display:flex;animation:in .3s}
.st{display:flex;justify-content:center}.st img{width:64px;height:64px;margin:0 4px;opacity:.18;filter:grayscale(1)}.st img.f{opacity:1;filter:none;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
#tro{width:150px;height:150px;display:none;animation:pop .6s}
.toast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:14px;z-index:20;font-size:15px;pointer-events:none;animation:in .2s}
canvas{position:absolute;inset:0;pointer-events:none;z-index:10}
</style></head><body>

function pay(k){const t=IT.find(x=>x.k==k);if(S.inv[k]>0){S.inv[k]--;return 1}
if(S.coins>=t.p){S.coins-=t.p;return 1}toast("سکهٔ کافی نداری");return 0}
function use(k){if(lock)return;const en=[...$("o").children].filter(b=>!b.disabled),wr=en.filter(b=>!b.dataset.c);
if(k=="h"&&$("h").textContent)return toast("سرنخ همین حالا نمایش داده شده");
if(k=="r1"&&wr.length<2||k=="r2"&&wr.length<3)return toast("حالا قابل استفاده نیست");
if(!pay(k))return;sfx("ok");if(k!="sk")used++;
if(k=="h")$("h").textContent=L[cur][3];
if(k[0]=="r")shuf(wr).slice(0,k=="r1"?1:2).forEach(b=>{b.disabled=1;b.classList.add("x")});
if(k=="sk"){lock=1;S.sk[cur]=1;toast("مرحله رد شد");setTimeout(()=>cur==L.length-1?menu():play(cur+1),600)}
sv();coins();items()}
function pause(){ov("pz",1)}
function openShop(f){sf=f;ov("pz",0);rshop();show("shop")}
function sback(){show(sf);if(sf=="game"){items();coins()}}
const PK=[{k:"coin_10",c:10,p:100000},{k:"coin_50",c:50,p:450000},{k:"coin_100",c:100,p:890000}];
const rial=n=>fa((n+"").replace(/\B(?=(\d{3})+(?!\d))/g,"٬"))+" ریال";
function rshop(){coins();$("shl").innerHTML=PK.map(t=>`<div class="card">${ic("coin",30)}<div class="ct"><b>${fa(t.c)} سکه</b><small>پرداخت امن از طریق مایکت</small></div><button class="btn buy" onclick="buy('${t.k}')">${rial(t.p)}</button></div>`).join("")}
function buy(k){if(!window.Android||!Android.buy){toast("پرداخت فقط در نسخهٔ اندروید (مایکت) فعال است");return}Android.buy(k)}
window.onMyketResult=function(ok,sku,token,msg){
if(!ok){toast(msg||"پرداخت انجام نشد");return}
S.tok=S.tok||[];if(token&&S.tok.includes(token)){return}
const t=PK.find(x=>x.k==sku);if(!t)return;

function sfx(n){if(!S.snd)return;try{const a=A[n].cloneNode();a.volume=.7;a.play()}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest(".btn,.lv,.ic,.it,.chip"))sfx("click")});
let ac,mt,mi=0;const N=[262,330,392,523,392,330,294,349,440,587,440,349];
function music(){clearInterval(mt);if(S.mus&&ac)mt=setInterval(()=>{if(!document.hidden)note(N[mi++%N.length])},420)}
function note(f){try{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f/2;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4)}catch(e){}}
addEventListener("pointerdown",()=>{if(!ac){try{ac=new(window.AudioContext||webkitAudioContext)();music()}catch(e){}}},{once:true});
const cv=$("cv"),x=cv.getContext("2d");let P=[];
function burst(){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<40;i++)P.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.8)*12,l:40,c:`hsl(${Math.random()*360},90%,65%)`});if(P.length==40)fr()}
function fr(){x.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;x.fillStyle=p.c;x.fillRect(p.x,p.y,6,6)});P.length&&requestAnimationFrame(fr)}
document.addEventListener("visibilitychange",()=>document.hidden&&$("game").classList.contains("on")&&!$("rs").classList.contains("on")&&pause());
